[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-continuous-compliance-rag"
version = "0.1.0"
description = "A traceable, human-in-the-loop RAG system for continuous AI compliance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true